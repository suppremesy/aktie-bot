<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Min aktieassistent</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mut:#6b7280;--up:#16a34a;--dn:#dc2626;--ac:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8eaed;--mut:#8b93a1;--up:#4ade80;--dn:#f87171;--ac:#60a5fa;--bd:#262c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 12px 24px}
h1{font-size:20px;margin:16px 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:700}.n{color:var(--mut);font-size:12px}
.p{text-align:right;font-weight:600}.up{color:var(--up)}.dn{color:var(--dn)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--bg)}
.kop{color:var(--up)}.salj{color:var(--dn)}
.note{color:var(--mut);font-size:11px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<h1>📊 Min aktieassistent</h1>
<div class="sub" id="upd">Laddar…</div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="note">Signaler är fingervisningar, inte finansiell rådgivning.</div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const F=[["alla","Alla"],["kop","🟢 Köplägen"],["salj","🔴 Säljlägen"],["rapport","📅 Rapport snart"],["rorelse","⚡ Rörelser"]];
let data=[],f="alla";
const fmtD=s=>s?s.slice(8)+"/"+s.slice(5,7):"";
function show(){
  const l=data.filter(s=>f==="alla"||(f==="kop"&&s.signal==="kop")||(f==="salj"&&s.signal==="salj")||
    (f==="rapport"&&s.earn_days!==null&&s.earn_days<=14)||(f==="rorelse"&&Math.abs(s.change)>=5));
  document.getElementById("list").innerHTML=l.length?l.map(s=>{
    const tags=[];
    if(s.signal==="kop")tags.push(`<span class="tag kop">🟢 Möjligt köpläge</span>`);
    if(s.signal==="salj")tags.push(`<span class="tag salj">🔴 Möjligt säljläge</span>`);
    tags.push(`<span class="tag">RSI ${s.rsi}</span>`);
    if(s.trend)tags.push(`<span class="tag">${s.trend==="upp"?"📈 Uppåttrend":"📉 Nedåttrend"}</span>`);
    if(s.earn)tags.push(`<span class="tag">📅 Rapport ${fmtD(s.earn)} (${s.earn_days} d)</span>`);
    if(s.ex)tags.push(`<span class="tag">💰 Ex-utdelning ${fmtD(s.ex)}</span>`);
    return `<div class="card"><div class="row"><div><div class="t">${s.t}</div><div class="n">${s.name}</div></div>
    <div class="p">${s.price.toLocaleString("sv-SE")} ${s.cur}<div class="${s.change>=0?"up":"dn"}">${s.change>=0?"+":""}${s.change.toFixed(1)}%</div></div></div>
    <div class="tags">${tags.join("")}</div></div>`}).join(""):`<div class="card n">Inga aktier matchar just nu.</div>`;
}
function chips(){
  const c=document.getElementById("chips");
  c.innerHTML=F.map(([k,v])=>`<button class="chip ${k===f?"on":""}" data-k="${k}">${v}</button>`).join("");
  c.querySelectorAll("button").forEach(b=>b.onclick=()=>{f=b.dataset.k;chips();show()});
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  data=d.stocks.sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));
  document.getElementById("upd").textContent="Uppdaterad "+new Date(d.updated).toLocaleString("sv-SE",{dateStyle:"short",timeStyle:"short"});
  chips();show();
}).catch(()=>{document.getElementById("upd").textContent="Kunde inte ladda data."});
</script>
</body>
</html>
