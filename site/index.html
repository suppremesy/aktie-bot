<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Min aktieassistent</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mut:#6b7280;--up:#16a34a;--dn:#dc2626;--ac:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8eaed;--mut:#8b93a1;--up:#4ade80;--dn:#f87171;--ac:#60a5fa;--bd:#262c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 8px 20px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px 6px}
h1{font-size:17px;margin:0}.sub{color:var(--mut);font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#list{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:520px){#list{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:700}.n{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.p{text-align:right;font-weight:600;white-space:nowrap}.up{color:var(--up)}.dn{color:var(--dn)}
.p small{display:block;font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:2px 7px;border-radius:7px;background:var(--bg)}
.kop{color:var(--up)}.salj{color:var(--dn)}
.big{font-weight:700;font-size:14px;text-align:right}.big span{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.note{color:var(--mut);font-size:10px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="top"><h1>📊 Min aktieassistent</h1><div class="sub" id="upd">Laddar…</div></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="note">Signaler är fingervisningar, inte finansiell rådgivning.</div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const F=[["alla","Alla"],["kop","🟢 Köp"],["salj","🔴 Sälj"],["rapport","📅 Rapporter"],["rorelse","⚡ Rörelser"]];
let data=[],f="alla";
const fmtD=s=>s?s.slice(8)+"/"+s.slice(5,7):"";
const daysTo=s=>Math.round((new Date(s)-new Date(new Date().toDateString()))/864e5);
function card(s){
  const tags=[];
  if(s.signal==="kop")tags.push(`<span class="tag kop">🟢 Köpläge · RSI ${s.rsi}</span>`);
  if(s.signal==="salj")tags.push(`<span class="tag salj">🔴 Säljläge · RSI ${s.rsi}</span>`);
  if(f==="alla"){
    if(s.earn_days!==null&&s.earn_days<=7)tags.push(`<span class="tag">📅 Rapport ${fmtD(s.earn)} (${s.earn_days===0?"idag":"om "+s.earn_days+" d"})</span>`);
    if(s.ex&&daysTo(s.ex)<=7)tags.push(`<span class="tag">💰 Ex-utdelning ${fmtD(s.ex)}</span>`);
  }
  const right=f==="rapport"
    ?`<div class="big">${fmtD(s.earn)}<span>${s.earn_days===0?"idag":"om "+s.earn_days+" dagar"}</span></div>`
    :`<div class="p">${s.price.toLocaleString("sv-SE")} ${s.cur}<small class="${s.change>=0?"up":"dn"}">${s.change>=0?"+":""}${s.change.toFixed(1)}%</small></div>`;
  return `<div class="card"><div class="row"><div><div class="t">${s.t}</div><div class="n">${s.name}</div></div>${right}</div>${tags.length&&f!=="rapport"?`<div class="tags">${tags.join("")}</div>`:""}</div>`;
}
function show(){
  let l=data.filter(s=>f==="alla"||(f==="kop"&&s.signal==="kop")||(f==="salj"&&s.signal==="salj")||
    (f==="rapport"&&s.earn)||(f==="rorelse"&&Math.abs(s.change)>=5));
  if(f==="rapport")l=l.slice().sort((a,b)=>a.earn_days-b.earn_days);
  document.getElementById("list").innerHTML=l.length?l.map(card).join(""):`<div class="card n">Inget just nu.</div>`;
}
function chips(){
  const c=document.getElementById("chips");
  c.innerHTML=F.map(([k,v])=>`<button class="chip ${k===f?"on":""}" data-k="${k}">${v}</button>`).join("");
  c.querySelectorAll("button").forEach(b=>b.onclick=()=>{f=b.dataset.k;chips();show()});
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  data=d.stocks.sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));
  document.getElementById("upd").textContent=new Date(d.updated).toLocaleString("sv-SE",{dateStyle:"short",timeStyle:"short"});
  chips();show();
}).catch(()=>{document.getElementById("upd").textContent="Kunde inte ladda data."});
</script>
</body>
</html>
