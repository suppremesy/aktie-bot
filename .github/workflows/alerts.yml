name: Aktielarm

on:
  schedule:
    - cron: "*/30 14-21 * * 1-5"   # var 30:e minut under börstid
    - cron: "0 16 * * 0"           # veckosammanfattning på söndagar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance requests
      - run: python alerts.py ${{ github.event.schedule == '0 16 * * 0' && 'weekly' || 'alerts' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Spara larmstatus
        run: |
          git config user.name "aktie-bot"
          git config user.email "bot@users.noreply.github.com"
          git add alerts_state.json || true
          git diff --cached --quiet || (git commit -m "Uppdatera larmstatus" && (git push || (git pull --rebase && git push)))
